services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expert_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
      POSTGRES_DB: ${POSTGRES_DB:-respiratory_expert}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - expert_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expert_user} -d ${POSTGRES_DB:-respiratory_expert}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-expert_user}:${POSTGRES_PASSWORD:-cambiar_en_produccion}@db:5432/${POSTGRES_DB:-respiratory_expert}?schema=public
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next
    networks:
      - expert_net

volumes:
  pgdata:
  app_node_modules:
  app_next_cache:

networks:
  expert_net:
    driver: bridge

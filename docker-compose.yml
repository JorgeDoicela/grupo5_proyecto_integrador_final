services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expert_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
      POSTGRES_DB: ${POSTGRES_DB:-respiratory_expert}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - expert_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expert_user} -d ${POSTGRES_DB:-respiratory_expert}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-expert_user}:${POSTGRES_PASSWORD:-cambiar_en_produccion}@db:5432/${POSTGRES_DB:-respiratory_expert}?schema=public
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - expert_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:

networks:
  expert_net:
    driver: bridge
